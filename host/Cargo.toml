[package]
name = "termx-host"
version = "0.2.0"
edition = "2021"

[[bin]]
name = "termx-host"
path = "src/main.rs"

[lib]
name = "termx_host"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "io-util", "signal"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
portable-pty = "0.9"
rand = "0.8"
base64 = "0.22"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects"] }
termx-swarm-core = { path = "../swarm-core" }
termx-swarm-client = { path = "../swarm-client" }

[features]
# Library-only seams for exact-owned test generations: trusted bindings,
# trusted sources and fixture source readers. Never reachable over the wire
# or the command line, and absent from ordinary builds.
swarm-test-seams = []

[dev-dependencies]
tempfile = "3"
rusqlite = { version = "=0.40.2", features = ["bundled", "hooks"] }
termx-host = { path = ".", features = ["swarm-test-seams"] }
