[package]
name = "termx-ui"
version = "0.1.0"
description = "TermX terminal UI (Tauri shell)"
authors = ["TermX"]
edition = "2021"

# Keep this crate out of the repo-root workspace (host-only) without editing
# the root Cargo.toml from the ui/ worker boundary.
[workspace]

[lib]
name = "termx_ui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
