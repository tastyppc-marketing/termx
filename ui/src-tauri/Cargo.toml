[package]
name = "termx-ui"
version = "0.2.0"
description = "TermX terminal UI (Tauri shell)"
authors = ["TermX"]
edition = "2021"

# Keep this crate out of the repo-root workspace (host-only) without editing
# the root Cargo.toml from the ui/ worker boundary.
[workspace]

# Without custom-protocol, tauri-build emits cfg(dev) and generate_context!
# bakes devUrl (localhost:1420) into the exe — even under --release. The Tauri
# CLI enables it automatically; this feature exists so a bare
# `cargo build --release --features custom-protocol` is also safe. Never put
# it in the tauri dependency's feature list directly: that would disable
# `tauri dev` hot reload.
[features]
custom-protocol = ["tauri/custom-protocol"]

[lib]
name = "termx_ui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = [] }
tauri-plugin-dialog = "2.7.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
tempfile = "3"
ureq = { version = "2", default-features = false }
# Transcript search's regex mode (src/transcript.rs). Already in the lock file
# as a transitive tauri dependency, so this adds no new build cost.
regex = "1.13"
# Transporting DPAPI blobs (src/ssh.rs) as text through IPC and the credentials
# file. Already in the lock file as a transitive dependency.
base64 = "0.22"
# Power-broadcast listener (src/power.rs): the message-only window, its pump,
# and RegisterSuspendResumeNotification. Plus DPAPI (src/ssh.rs). Same version
# the host crate pins.
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",
    "Win32_System_LibraryLoader",
    "Win32_System_Power",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
